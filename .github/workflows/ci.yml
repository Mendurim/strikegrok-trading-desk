name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # scripts/check.sh is offline and standard-library only, so there is
      # nothing to install and no credential to provide.
      - name: Validate the repository
        run: bash scripts/check.sh

      # Reads Strike's public Price Service only. Allowed to fail the job so a
      # broken endpoint is visible, but it touches no account and no key.
      - name: Desk doctor
        run: python3 scripts/desk_doctor.py

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
